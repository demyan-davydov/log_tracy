<html theme="light" window-width="920" window-height="440">

<!-- The Settings dialog, opened modal by openSettingsAction() in script.js.
     Its sections are listed on the left; Save applies all of them at once.
     Parameters: { section (shown first: "appearance", "table"), theme, tableFontSize,
     singleLineRows, language (the setting, "": the
     system's), languages (of the translations, as getLanguages gives them),
     catalog (of the translations the texts are in, null: english), columns (as
     getColumnSettings gives them, see column-settings.js) }.
     Closes with { theme, tableFontSize, singleLineRows, language, columnLayouts }, or null on
     Cancel. -->

<head>
    <title>Settings</title>
    <style id="theme-style" src="theme-light.css" />
    <style src="style.css" />
    <style src="table.css" />
    <style>
        html, body { background: var(--bg-main); color: var(--text-main); }
        body { flow: vertical; }
        #layout { size: *; flow: horizontal; }

        /* The sections, as tabs on the left */
        #sections {
            width: 170dip; height: *;
            flow: vertical; border-spacing: 2dip;
            padding: 12dip 8dip;
            background: var(--bg-sidebar);
            border-right: 1dip solid var(--border-color);
        }
        .section-tab {
            padding: 6dip 10dip;
            border-radius: 6dip;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-main);
        }
        .section-tab:hover { background: var(--bg-tab-hover); }
        .section-tab.active { background: var(--btn-primary-bg); color: var(--btn-primary-text); }

        main { size: *; overflow-y: auto; padding: 16dip 20dip; }
        .section { flow: vertical; border-spacing: 12dip; }
        .section:not(.active) { display: none; }
        .section-title { font-size: 1.25em; font-weight: 600; }
        .hint { color: var(--text-label); font-size: 0.9em; }

        .setting-group { margin-bottom: 0; }
        /* A fixed width, not the whole section (user's choice) */
        .setting-group select { width: 16em; }
        /* A checkbox setting: the box and its text on one line, the text not bold */
        .setting-group label.check { flow: horizontal; vertical-align: middle; border-spacing: 6dip; font-weight: normal; }

        /* Columns: a strip of column headers as the log table shows them
           (table.css), Index first, the movable ones, Payload last taking the
           rest; under each header the checkbox that shows it. A header is
           both .column-header-row and .column-header: the row of a table has
           the background, its cells the rest */
        #column-strip {
            width: *;
            flow: horizontal;
            border: 1dip solid var(--border-color);
            background: var(--bg-main);
            white-space: nowrap;
        }
        /* A large font makes the strip wider than the dialog: it scrolls, as
           the log table does, never cut; the room under it is for the
           scrollbar, which macOS draws over the content */
        #column-scroller {
            width: *;
            overflow-x: auto;
            padding-bottom: 10dip;
        }
        #column-list {
            position: relative; /* for #column-drop-marker */
            flow: horizontal;
            overflow: visible;
        }
        .column-cell {
            position: relative; /* z-index of the dragged one: above the others */
            flow: vertical;
            background: var(--bg-main);
        }
        .column-cell.payload { width: *; min-width: max-content; } /* scrolled to, not squeezed away */
        /* The border of the strip ends the last one */
        .column-cell.payload > .column-header,
        .column-cell.payload > .visibility { border-right: none; }
        .column-cell > .column-header { display: block; }
        .column-cell > .visibility {
            flow: horizontal;
            font-size: 1rem; /* the checkbox keeps its size whatever the font of the headers */
            padding: 4dip 0;
            border-right: 1dip solid var(--border-color);
        }
        .column-cell > .visibility > input { margin: 0 *; } /* centered */
        .column-cell.movable > .column-header { cursor: move; }
        .column-cell.movable > .column-header:hover { background: var(--bg-tab-hover); }
        /* A hidden column: its header faded, as if it weren't there */
        .column-cell.hidden-column > .column-header { opacity: 0.4; }
        .column-cell.fixed > .column-header { color: var(--text-label); }

        /* Dragging a column, as a tab is dragged (see script.js) */
        .column-cell.shifting { transition: transform cubic-out 150ms; }
        .column-cell.dragging {
            z-index: 10;
            box-shadow: 0 1dip 6dip rgba(0, 0, 0, 0.25);
        }
        .column-cell.dragging.settling { transition: transform cubic-out 150ms; }
        #column-drop-marker {
            /* left/top/height are set by showDropMarker(): on the edge of the place the column lands on */
            display: none;
            position: absolute;
            width: 2dip;
            border-radius: 1dip;
            background: var(--btn-primary-bg);
            z-index: 5; /* below the dragged column */
        }

        /* The font size the dialog opened with: where the user started.
           Sciter's own style of the options wins without !important */
        select#table-font-size > popup > option.initial { font-style: italic !important; }

        #columns-footer { flow: horizontal; vertical-align: middle; }
        #btn-reset-columns { margin-left: *; }
        #btn-reset-columns:disabled { opacity: 0.4; cursor: default; }

        /* Cancel and Save on the right, as in dialogs of the system */
        footer > button#btn-cancel { margin-left: *; }
    </style>
    <script type="module">
        import { $, $$ } from "@sciter";
        import { toggleColumn, moveColumn, resetColumns, isDefaultLayout, layoutsOf, initialFormat, formatLabel } from "column-settings.js";
        import { setShift, pressItem, dragTo, drop, showDropMarker } from "drag-strip.js";
        import * as platform from "platform.js";
        import { initialSection, fontSizeOptions } from "settings-sections.js";
        import { applyTheme } from "theme.js";
        import { setCatalog, tr } from "i18n/i18n.js";
        import { translateTree } from "i18n/dom.js";
        import { languageOptions } from "i18n/languages.js";

        // Without parameters (opened on its own to look at it): a sample DLT log
        const params = platform.dialogParameters() || {
            theme: "light", tableFontSize: 100, columns: {
                current: "dlt", formats: [{
                    id: "dlt", name: "DLT", payload: "Payload",
                    defaults: ["time", "timestamp", "counter", "ecu", "app", "ctx", "session", "type", "level", "msgid"],
                    columns: [["time", "Time"], ["timestamp", "Timestamp"], ["counter", "Count"], ["ecu", "EcuId"],
                        ["app", "AppId"], ["ctx", "CtxId"], ["session", "SessionId"], ["type", "Type"],
                        ["level", "Level"], ["msgid", "MsgId"]].map(([id, title]) => ({ id, title, visible: id !== "session" }))
                }, {
                    id: "logcat", name: "Android logcat", payload: "Message",
                    defaults: ["time", "pid", "tid", "level", "tag"],
                    columns: [["time", "Time"], ["pid", "PID"], ["tid", "TID"], ["level", "Level"], ["tag", "Tag"]]
                        .map(([id, title]) => ({ id, title, visible: true }))
                }]
            }
        };

        // ── Sections ─────────────────────────────────────────────────────────

        function setClass(element, name, on) {
            if (on) element.classList.add(name);
            else element.classList.remove(name);
        }

        function showSection(id) {
            for (const tab of $$(".section-tab"))
                setClass(tab, "active", tab.getAttribute("section") === id);
            for (const section of $$(".section"))
                setClass(section, "active", section.id === id);
        }

        document.on("click", ".section-tab", (evt, tab) => {
            showSection(tab.getAttribute("section"));
            return true;
        });

        // ── Columns ──────────────────────────────────────────────────────────

        // The formats with columns to arrange, edited here until Save
        let formats = params.columns?.formats || [];
        const currentFormat = params.columns?.current || ""; // of the active document
        let shown = initialFormat(formats, currentFormat);

        function renderFormats() {
            const select = $("select#column-format");
            select.innerHTML = "";
            formats.forEach((f, i) => select.append(<option value={String(i)}>{formatLabel(f, currentFormat)}</option>));
            if (shown >= 0) select.value = String(shown);
        }

        function renderColumns() {
            const list = $("#column-list");
            list.innerHTML = "";
            const format = formats[shown];
            if (!format) return;
            $("#last-column-title").textContent = format.payload || "Payload";
            format.columns.forEach((c, i) => {
                list.append(<div class={c.visible ? "column-cell movable" : "column-cell movable hidden-column"} index={String(i)}>
                    <div class="column-header-row column-header">{c.title}</div>
                    <div class="visibility"><input type="checkbox" /></div>
                </div>);
                list.lastElementChild.$("input").value = c.visible; // not by the attribute: see AGENTS.md
            });
            $("#btn-reset-columns").state.disabled = isDefaultLayout(format);
        }

        // Replaces the format at `index` (the one shown by default)
        function setFormat(format, index = shown) {
            formats = formats.map((f, i) => i === index ? format : f);
        }

        function setShownFormat(format) {
            setFormat(format);
            renderColumns();
        }

        document.on("change", "select#column-format", (evt, select) => {
            shown = parseInt(select.value);
            renderColumns();
        });

        document.on("click", "#btn-reset-columns", () => {
            setShownFormat(resetColumns(formats[shown]));
            return true;
        });

        // The checkbox under a header shows and hides its column
        document.on("change", ".column-cell.movable input[type=checkbox]", (evt, box) => {
            const cell = box.parentElement.parentElement;
            setShownFormat(toggleColumn(formats[shown], formats[shown].columns[parseInt(cell.getAttribute("index"))].id));
            return true;
        });

        // The sizes offered, the one the dialog opened with in italics and chosen
        function renderFontSizes() {
            const select = $("select#table-font-size");
            const options = fontSizeOptions(params.tableFontSize);
            for (const { value, label, initial } of options) {
                const option = document.createElement("option");
                option.setAttribute("value", String(value)); // an <option> has no value of its own in Sciter
                if (initial) option.classList.add("initial");
                option.textContent = label;
                select.append(option);
            }
            select.value = String(options.find(o => o.initial).value);
        }

        // The strip has the font size of the log tables, as chosen above it
        function applyTableFontSize() {
            $("#column-strip").style.fontSize = `${$("select#table-font-size").value}%`;
        }

        document.on("change", "select#table-font-size", applyTableFontSize);

        // ── Dragging a column ────────────────────────────────────────────────
        // As a tab is dragged (drag-strip.js), by its header. Index and Payload
        // are outside the list: nothing moves past them.
        // columnDrag: the drag of drag-strip.js with { format (its index) },
        //             null when no column is held.
        let columnDrag = null;

        document.on("mousedown", ".column-cell.movable > .column-header", (evt, header) => {
            if (evt.buttons & 6) return; // only the left button
            if (columnDrag?.settling) return; // the previous drop is still settling
            if (columnDrag) { // released outside the dialog: the press is dropped
                columnDrag = null;
                renderColumns(); // the columns without shifts
                return true; // the header pressed is a new element now
            }
            beginColumnDrag(header.parentElement, evt.clientX);
            return true; // no text selection
        });

        document.on("mousemove", (evt) => {
            if (columnDrag) moveColumnDrag(evt.clientX);
        });

        document.on("mouseup", () => {
            if (columnDrag) endColumnDrag();
        });

        function beginColumnDrag(cell, clientX) {
            const cells = [...$$("#column-list > .column-cell")];
            const from = cells.indexOf(cell);
            if (from < 0) return;
            columnDrag = pressItem(cells, from, clientX);
            columnDrag.format = shown;
        }

        function moveColumnDrag(clientX) {
            const landed = dragTo(columnDrag, clientX,
                () => $("#column-list").append(<div id="column-drop-marker"></div>));
            if (landed) showColumnDropMarker(columnDrag);
        }

        function endColumnDrag() {
            const d = columnDrag;
            if (d.settling) return;
            const settles = drop(d, () => {
                columnDrag = null;
                renderColumns();
            });
            if (!settles) { // a click on a header: nothing to do
                columnDrag = null;
                return;
            }
            // The new order is kept at once (a Save or another format chosen
            // while the column slides keeps it); the strip is rebuilt after the slide
            if (d.to !== d.from) setFormat(moveColumn(formats[d.format], d.from, d.to), d.format);
        }

        // The marker is on the edge of the place the column lands on, as that
        // of the tabs, the whole height of the strip
        function showColumnDropMarker(d) {
            const marker = $("#column-drop-marker");
            showDropMarker(marker, d, origin => {
                const cell = d.rects[d.from];
                const edge = d.to > d.from ? d.rects[d.to].right : d.rects[d.to].left;
                marker.style.left = `${edge - origin.width / 2 - origin.left}px`;
                marker.style.top = `${cell.top - origin.top}px`;
                marker.style.height = `${cell.bottom - cell.top}px`;
            });
        }

        // ── The dialog ───────────────────────────────────────────────────────

        setCatalog(params.catalog || null);

        // The options of the language: the system's, english, the translations
        function renderLanguages() {
            const select = $("select#language");
            for (const { value, label } of languageOptions(params.languages || [], params.language || "")) {
                const option = document.createElement("option");
                option.setAttribute("value", value); // an <option> has no value of its own in Sciter
                option.textContent = label;
                select.append(option);
            }
            select.value = params.language || "";
        }

        document.on("ready", () => {
            translateTree(document);
            platform.setDialogTitle(tr("Settings"));
            renderLanguages();
            if (params.theme === "dark") {
                applyTheme("dark");
                $("select#theme").value = "dark";
            } else {
                $("select#theme").value = "light";
            }
            renderFontSizes();
            applyTableFontSize();
            $("#single-line-rows").value = !!params.singleLineRows;
            if (formats.length) {
                renderFormats();
                renderColumns();
            } else {
                $("#columns-content").style.display = "none";
                $("#no-columns").style.display = "block";
            }
            const sections = [...$$(".section-tab")].map(tab => tab.getAttribute("section"));
            showSection(initialSection(platform.dialogParameters(), sections));
        });

        $("#btn-save").on("click", () => {
            platform.closeDialog({
                theme: $("select#theme").value,
                language: $("select#language").value,
                tableFontSize: parseInt($("select#table-font-size").value),
                singleLineRows: !!$("#single-line-rows").value,
                columnLayouts: formats.length ? layoutsOf(formats) : null,
            });
        });

        $("#btn-cancel").on("click", () => {
            platform.closeDialog(null);
        });
    </script>
</head>

<body>
    <div id="layout">
        <nav id="sections">
            <div class="section-tab active" section="appearance" data-tr="Appearance"></div>
            <div class="section-tab" section="table" data-tr="Table"></div>
        </nav>
        <main>
            <div class="section active" id="appearance">
                <div class="section-title" data-tr="Appearance"></div>
                <div class="setting-group">
                    <label data-tr="Language"></label>
                    <select id="language"></select>
                </div>
                <div class="setting-group">
                    <label data-tr="Theme"></label>
                    <select id="theme">
                        <option value="light" data-tr="Light"></option>
                        <option value="dark" data-tr="Dark"></option>
                    </select>
                </div>
            </div>
            <div class="section" id="table">
                <div class="section-title" data-tr="Table"></div>
                <div class="setting-group">
                    <label data-tr="Font size"></label>
                    <select id="table-font-size"></select>
                </div>
                <div class="setting-group">
                    <label class="check"><input type="checkbox" id="single-line-rows" /><span data-tr="Single-line rows"></span></label>
                    <div class="hint" data-tr="Every row is one line high; a long payload goes on to the right, scroll the table sideways to read it."></div>
                </div>
                <div class="hint" data-tr="The columns of the log tables, the same for every log of a format. Drag a header to move its column, untick it to hide the column."></div>
                <div id="columns-content" style="flow: vertical; border-spacing: 12dip;">
                    <div class="setting-group">
                        <label data-tr="Format"></label>
                        <select id="column-format"></select>
                    </div>
                    <div id="column-scroller"><div id="column-strip">
                        <div class="column-cell fixed" data-tr-title="Always first">
                            <div class="column-header-row column-header">Index</div>
                            <div class="visibility"><input type="checkbox" checked disabled /></div>
                        </div>
                        <div id="column-list"></div>
                        <div class="column-cell fixed payload" data-tr-title="Always last">
                            <div class="column-header-row column-header" id="last-column-title">Payload</div>
                            <div class="visibility"><input type="checkbox" checked disabled /></div>
                        </div>
                    </div></div>
                    <div id="columns-footer">
                        <button id="btn-reset-columns" data-tr="Reset to Default"></button>
                    </div>
                </div>
                <div class="hint" id="no-columns" style="display: none;" data-tr="No format has columns to arrange."></div>
            </div>
        </main>
    </div>
    <footer>
        <button id="btn-cancel" data-tr="Cancel"></button>
        <button id="btn-save" class="primary" data-tr="Save"></button>
    </footer>
</body>

</html>
