<html theme="light" window-width="640" window-height="800">

<!-- The editor of one filter rule, opened modal by editRule() in script.js,
     for a log of any format: a row of conditions per column of the format
     (see rule-form.js), laid out like the filter dialog of dlt-viewer.
     Parameters: { title, theme, rule (as a filter file has it), columns
     (as getColumns gives them), error }.
     Closes with the edited rule, or null on Cancel. -->

<head>
    <title>Filter Rule</title>
    <style id="theme-style" src="theme-light.css" />
    <style src="style.css" />
    <style>
        html, body { background: var(--bg-main); color: var(--text-main); }
        body { flow: vertical; }
        main { size: *; overflow-y: auto; padding: 14dip 18dip; flow: vertical; border-spacing: 10dip; }

        /* A row: [switch + label] [value] [options]; the columns line up */
        .row { flow: horizontal; vertical-align: middle; border-spacing: 8dip; }
        .row > .label { width: 150dip; flow: horizontal; vertical-align: middle; border-spacing: 6dip; white-space: nowrap; overflow-x: hidden; }
        .row > .value { width: *; flow: horizontal; vertical-align: middle; border-spacing: 6dip; }
        .row > .options { width: 60dip; flow: horizontal; vertical-align: middle; white-space: nowrap; }
        .row > .value > span { margin: * 0; } /* centered in the row: from, to */
        .row input[type=text] { width: *; }
        .row select.check { width: 100dip; }
        .row select.level, .row select.label-value { width: 120dip; }
        label { flow: horizontal; vertical-align: middle; border-spacing: 4dip; white-space: nowrap; }

        input[type=text] {
            padding: 4dip 6dip;
            border: 1dip solid var(--border-input);
            border-radius: 4dip;
            background: var(--bg-input);
            color: var(--text-main);
        }
        input[type=text]:focus { border-color: var(--border-focus); outline: none; }

        /* A group of related fields: Type, Color */
        .group { flow: vertical; border-spacing: 8dip; padding: 10dip 12dip; border-radius: 8dip; background: var(--bg-details); }
        .group-title { font-weight: 600; color: var(--text-label); }
        .row > .value.radios { border-spacing: 24dip; }
        .separator { height: 1dip; background: var(--border-color); margin: 4dip 0; }
        .section-title { font-weight: 600; color: var(--text-label); }

        .palette { flow: horizontal; vertical-align: middle; border-spacing: 8dip; margin-left: 158dip; }
        .swatch {
            width: 20dip; height: 20dip; border-radius: 4dip; cursor: pointer;
            border: 1dip solid var(--border-color);
        }
        .swatch:hover { border-color: var(--text-main); }

        #conditions { flow: vertical; border-spacing: 10dip; }
        .condition { flow: vertical; border-spacing: 3dip; }
        /* A wrong condition: its fields are red, its message under them */
        .condition.invalid .value input[type=text],
        .condition.invalid .value select { border-color: var(--log-error); }
        .condition.invalid .label { color: var(--log-error); }
        .row-error { margin-left: 158dip; font-size: 0.85em; color: var(--log-error); }
        .row-error:empty { display: none; }
        .kept-error { margin-left: 0; }
        #ok-hint { width: *; margin: * 0; text-align: left; font-size: 0.85em; color: var(--text-label); }
        /* Blocked while a condition is wrong */
        #btn-ok:disabled { opacity: 0.4; cursor: default; }
        /* A condition on a column the log doesn't have: not applied, not a mistake */
        .kept-error.missing { color: var(--text-label); }
        .kept { flow: horizontal; vertical-align: middle; border-spacing: 8dip; }
        .kept > .text { width: *; font-family: monospace; }
        .kept-remove { width: 16dip; text-align: center; border-radius: 8dip; cursor: pointer; color: var(--tab-close); }
        .kept-remove:hover { background: var(--tab-close-hover); }

        .hint { font-size: 0.85em; color: var(--text-label); }
        #rule-error { color: var(--log-error); }
        #rule-error:empty { display: none; }
        /* OK and Cancel on the right, as in dialogs of the system */
        footer > button#btn-cancel { margin-left: *; }
    </style>
    <script type="module">
        import { $, $$ } from "@sciter";
        import { editableColumns, rowsFromRule, conditionsFromRows, describeCondition, errorsOfRows, levelNames } from "rule-form.js";
        import * as platform from "platform.js";
        import { applyTheme } from "theme.js";
        import { setCatalog, tr, trc } from "i18n/i18n.js";
        import { translateTree } from "i18n/dom.js";

        const params = platform.dialogParameters() || {};
        // Without parameters (opened on its own to look at it): a sample log
        const columns = params.columns || [
            { id: "ecu", title: "EcuId", kind: "Text" },
            { id: "app", title: "AppId", kind: "Text" },
            { id: "session", title: "SessionId", kind: "Integer" },
            { id: "type", title: "Type", kind: "Enum", labels: ["LOG", "APP", "NW", "CTRL"] },
            { id: "level", title: "Level", kind: "Level" },
            { id: "msgid", title: "MsgId", kind: "Integer" },
            { id: "payload", title: "Payload", kind: "Payload" },
        ];
        setCatalog(params.catalog || null);
        const rule = params.rule || { name: tr("New Rule"), kind: "include", enabled: true, conditions: [] };
        const editable = editableColumns(columns);
        let kept = [];

        const checkTitles = { equals: trc("check", "is"), contains: trc("check", "contains"), regex: trc("check", "matches regex") };

        // The controls of a row by their role, for a column of its kind
        function renderRow(column) {
            const value = (() => {
                switch (column.kind) {
                    case "Text":
                    case "Payload":
                        return [
                            <select class="check" role="check">
                                {Object.keys(checkTitles).map(c => <option value={c}>{checkTitles[c]}</option>)}
                            </select>,
                            <input type="text" role="value" />
                        ];
                    case "Integer":
                    case "Hex": {
                        // Only what a number of the column is made of can be typed:
                        // digits, hex digits and the x of 0x in a hex column
                        const filter = column.kind === "Hex" ? "0~9a~fA~FxX" : "0~9";
                        return [<input type="text" role="from" filter={filter} />, <span>{trc("range", "to")}</span>,
                            <input type="text" role="to" filter={filter} />];
                    }
                    case "Level":
                        return [
                            <select class="level" role="from">{levelNames.map(l => <option value={l}>{l}</option>)}</select>,
                            <span>{trc("range", "to")}</span>,
                            <select class="level" role="to">{levelNames.map(l => <option value={l}>{l}</option>)}</select>
                        ];
                    case "Enum":
                        return [<select class="label-value" role="value">
                            {(column.labels || []).map(l => <option value={l}>{l}</option>)}
                        </select>];
                }
            })();
            const textual = column.kind === "Text" || column.kind === "Payload";
            return <div class="condition" column={column.id}>
                <div class="row">
                    <div class="label"><label><input type="checkbox" role="on" />{column.title}</label></div>
                    <div class="value">{value}</div>
                    <div class="options">{textual ? <label title={tr("Ignore case")}><input type="checkbox" role="ignoreCase" /> Aa</label> : []}</div>
                </div>
                <div class="row-error"></div>
            </div>;
        }

        function control(row, role) {
            return row.$(`[role="${role}"]`);
        }

        function writeRows(rows) {
            for (const row of $$(".condition")) {
                const values = rows[row.getAttribute("column")];
                for (const role of Object.keys(values)) {
                    const c = control(row, role);
                    if (c) c.value = values[role];
                }
            }
        }

        function readRows() {
            const rows = {};
            for (const row of $$(".condition")) {
                const values = {};
                for (const c of row.$$("[role]")) {
                    const role = c.getAttribute("role");
                    values[role] = c.getAttribute("type") === "checkbox" ? !!c.value : (c.value ?? "");
                }
                rows[row.getAttribute("column")] = values;
            }
            return rows;
        }

        function showKept() {
            const list = $("#kept");
            list.clear();
            $("#kept-section").style.display = kept.length ? "" : "none";
            kept.forEach((condition, i) => {
                list.append(<div class="kept">
                    <span class="text">{describeCondition(condition)}</span>
                    <span class="kept-remove" index={i} title={tr("Remove this condition")}>×</span>
                </div>);
                list.append(<div class="row-error kept-error" index={i}></div>);
            });
            validate();
        }

        // Asks the log (params.check, see editRule() in script.js) what is wrong
        // with the rule as it is now and shows it at once: the row of a wrong
        // condition is marked, its message is under it. A rule switched on
        // can't be taken while something is wrong; one switched off can,
        // with its errors, to be fixed later.
        function validate() {
            if (!params.check) return;
            const rule = read();
            const result = JSON.parse(params.check(rule) || "{}");
            const errors = errorsOfRows(readRows(), columns, kept, result.conditions || [], result.missing || []);
            for (const condition of $$(".condition")) {
                const message = errors.rows[condition.getAttribute("column")] || "";
                condition.classList.toggle("invalid", !!message);
                condition.$(".row-error").innerText = message;
            }
            const offset = (result.conditions || []).length - kept.length;
            for (const error of $$(".kept-error")) {
                const k = parseInt(error.getAttribute("index"));
                error.innerText = errors.kept[k] || "";
                error.classList.toggle("missing", !!(result.missing || [])[offset + k]);
            }
            $("#rule-error").innerText = result.error || "";
            const blocked = (!!result.error || errors.blocking) && rule.enabled;
            $("#btn-ok").state.disabled = blocked;
            $("#ok-hint").innerText = blocked
                ? tr("Fix the marked conditions, or switch the rule off to keep it as it is") : "";
        }

        function read() {
            const type = [...$$("input[name=kind]")].find(radio => radio.state.checked);
            const color = $("#has-color").value ? $("#color").value : null; // none: no color
            return {
                name: $("#name").value || "",
                kind: type ? type.getAttribute("value") : "include",
                enabled: !!$("#enabled").value,
                color: color ? color.toString("RGB") : "",
                conditions: conditionsFromRows(readRows(), columns, kept)
            };
        }

        document.on("ready", () => {
            if (params.theme === "dark") applyTheme("dark");
            translateTree(document);
            platform.setDialogTitle(params.title || tr("Filter Rule"));
            const conditions = $("#conditions");
            for (const column of editable) conditions.append(renderRow(column));

            $("#name").value = rule.name || "";
            $("#enabled").value = rule.enabled !== false;
            const radio = $(`input[name=kind][value="${rule.kind || "include"}"]`);
            if (radio) radio.state.checked = true;
            $("#has-color").value = !!rule.color;
            $("#color").value = rule.color || "#000000";
            const shown = rowsFromRule(rule, columns);
            kept = shown.kept;
            writeRows(shown.rows);
            showKept();
            $("#rule-error").innerText = params.error || "";
            $("#name").focus();
        });

        // Typed into, or chosen: its condition is switched on
        function switchOn(evt, c) {
            const row = c.$p(".condition");
            if (row) control(row, "on").value = true;
            validate();
        }
        document.on("input", ".condition input[type=text]", switchOn);
        document.on("change", ".condition select", switchOn);
        document.on("change", "input[type=checkbox]", () => validate());

        document.on("click", ".kept-remove", (evt, button) => {
            kept.splice(parseInt(button.getAttribute("index")), 1);
            showKept();
        });
        document.on("click", ".palette .swatch[color]", (evt, swatch) => {
            $("#color").value = swatch.getAttribute("color");
            $("#has-color").value = true;
        });
        document.on("change", "#color", () => { $("#has-color").value = true; });

        function accept() {
            if (!$("#btn-ok").state.disabled) platform.closeDialog(read());
        }
        $("#btn-ok").on("click", accept);
        $("#btn-cancel").on("click", () => platform.closeDialog(null));

        document.on("keydown", (evt) => {
            if (evt.code === "Escape") { platform.closeDialog(null); return true; }
            if (evt.code === "Enter" && evt.target.tag === "input") { accept(); return true; }
        });
    </script>
</head>

<body>
    <main>
        <div id="rule-error"></div>

        <div class="row">
            <div class="label"><label><input type="checkbox" id="enabled" /> <span data-tr="Active"></span></label></div>
        </div>
        <div class="row">
            <div class="label" data-tr="Name"></div>
            <div class="value"><input type="text" id="name" /></div>
        </div>

        <div class="group">
            <div class="row">
                <div class="label group-title" data-tr="Type"></div>
                <div class="value radios">
                    <label><input type="radio" name="kind" value="include" /> <span data-tr="Include (positive)"></span></label>
                    <label><input type="radio" name="kind" value="exclude" /> <span data-tr="Exclude (negative)"></span></label>
                    <label><input type="radio" name="kind" value="marker" /> <span data-tr="Marker"></span></label>
                </div>
            </div>
        </div>

        <div class="group">
            <div class="row">
                <div class="label group-title"><label><input type="checkbox" id="has-color" /> <span data-tr="Color"></span></label></div>
                <!-- The color input of Sciter: a swatch, the value and a picker -->
                <div class="value"><input type="color" id="color" /></div>
            </div>
            <div class="palette">
                <span class="swatch" color="#ff0000" style="background:#ff0000"></span>
                <span class="swatch" color="#ffff00" style="background:#ffff00"></span>
                <span class="swatch" color="#00ff00" style="background:#00ff00"></span>
                <span class="swatch" color="#00ffff" style="background:#00ffff"></span>
                <span class="swatch" color="#0000ff" style="background:#0000ff"></span>
                <span class="swatch" color="#ff00ff" style="background:#ff00ff"></span>
                <span class="swatch" color="#ff9999" style="background:#ff9999"></span>
                <span class="swatch" color="#ffffcc" style="background:#ffffcc"></span>
                <span class="swatch" color="#99ff99" style="background:#99ff99"></span>
                <span class="swatch" color="#9999ff" style="background:#9999ff"></span>
                <span class="swatch" color="#ff99ff" style="background:#ff99ff"></span>
            </div>
        </div>

        <div class="separator"></div>
        <div class="section-title" data-tr="Conditions: all checked ones must match"></div>
        <div id="conditions"></div>
        <div class="hint" data-tr="Numbers: an empty &quot;to&quot; is a single value; hex columns take hex digits. Regular expressions are found anywhere in the text."></div>

        <div id="kept-section">
            <div class="section-title" data-tr="Other conditions, kept as they are"></div>
            <div class="hint" data-tr="On columns this log doesn't have (they aren't applied), or a second one on a column."></div>
            <div id="kept"></div>
        </div>
    </main>
    <footer>
        <span id="ok-hint"></span>
        <button id="btn-cancel" data-tr="Cancel"></button>
        <button id="btn-ok" class="primary" data-tr="OK"></button>
    </footer>
</body>

</html>
