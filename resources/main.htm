<html window-resizable="true" window-width="1000" window-height="800">

<head>
    <title>DLT Explorer</title>
    <style id="theme-style" src="theme-light.css" />
    <style src="style.css" />
    <style src="table.css" />
    <style src="tab-content.css" />
    <script type="module" src="script.js" />
    <script type="module" src="virtual-dlt-view.js" />
</head>

<body>
    <header>
        <div class="toolbar">
            <button id="btn-open">Open File</button>
            <button id="btn-fibex">Load FIBEX</button>
            <input type="text" id="search-bar" placeholder="Search logs..." />
            <button id="btn-theme">Toggle Theme</button>
            <button id="btn-settings">Settings</button>
        </div>
        <div id="tabs-container">
            <button id="btn-add-tab">+</button>
            <!-- Tabs will be dynamically added here -->
        </div>
    </header>

    <frameset cols="200px, *">
        <section id="sidebar">
            <header>Filters</header>
            <div class="filter-group">
                <label>ECU ID</label>
                <input type="text" id="filter-ecu" placeholder="e.g. ECU1" />
            </div>
            <div class="filter-group">
                <label>App ID</label>
                <input type="text" id="filter-app" placeholder="e.g. APP1" />
            </div>
            <div class="filter-group">
                <label>Context ID</label>
                <input type="text" id="filter-ctx" placeholder="e.g. CTX1" />
            </div>
            <div class="filter-group">
                <label>Payload Regex</label>
                <input type="text" id="filter-payload" placeholder="e.g. error.*" />
            </div>
            <div class="filter-actions">
                <button id="btn-clear-filters">Clear All</button>
            </div>
            <div id="filter-progress" style="display:none; margin-top:10px;">
                <progress id="search-progress" value="0" max="100"></progress>
                <span id="search-status">Searching...</span>
            </div>
        </section>

        <frameset rows="*, 200px">
            <div id="main-content">
                <div id="empty-placeholder" style="display:none;">
                    <div class="icon">📁</div>
                    <div class="text">No documents open. Click + to open a DLT file.</div>
                </div>
                <div id="tab-content" class="tab-content">
                    <div id="loading-container" class="loading-container" style="display:none;">
                        <progress id="doc-load-progress" value="0" max="100"></progress>
                        <div id="doc-load-status">Loading DLT file...</div>
                    </div>
                    <table class="log-table" fixed-layout="true" selectable="true">
                        <thead>
                            <tr>
                                <th width="80px">Index</th>
                                <th width="120px">Time</th>
                                <th width="150px">Timestamp</th>
                                <th width="60px">ECU</th>
                                <th width="60px">AppID</th>
                                <th width="60px">CtxID</th>
                                <th width="60px">Len</th>
                                <th width="60px">Type</th>
                                <th width="60px">Level</th>
                                <th width="*">Payload</th>
                            </tr>
                        </thead>
                        <tbody class="log-list" />
                    </table>
                </div>
            </div>

            <section id="details-panel">
                <header>Details / Search Results</header>
                <div class="content">
                    Selected log details here...
                </div>
            </section>
        </frameset>
    </frameset>
</body>

</html>
