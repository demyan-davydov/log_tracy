<html theme="light" window-resizable="true" window-width="1000" window-height="800" window-frame="standard">

<head>
    <title>Log Tracy</title>
    <style src="theme-light.css" />
    <style src="theme-dark.css" />
    <style src="style.css" />
    <style src="table.css" />
    <style src="tab-content.css" />
    <style src="menu-bar.css" />
    <style src="match-colors.css" />
    <style src="search-editor.css" />
    <script type="module" src="script.js" />
    <script type="module" src="virtual-dlt-view.js" />
    <script type="module" src="painted-table.js" />
    <script type="module" src="log-table.js" />
</head>

<body>
    <!-- The menu bar on Windows and Linux (macOS: the native menu), filled by
         setupMenuBar() from the backend -->
    <div id="main-menu" style="display: none;"></div>
    <header>
        <!-- Open File, Settings: in the menu; the theme: in Settings -->
        <!-- Focusable: a press on a tab moves the focus here, not to nothing
             (press-focus.js) -->
        <div id="tabs-container" tabindex="0">
            <!-- The + button followed by the tabs, rendered by refreshTabs() -->
            <button id="btn-add-tab" data-tr-title="New Tab" style="display:none;">+</button>
        </div>
    </header>

    <!-- Instead of all the panels below while no document is open; filled by
         renderPlaceholder() -->
    <div id="empty-placeholder" tabindex="-1" style="display:none;"></div>

    <!-- The panels of the open documents, one per tab, only the active one
         shown: DocumentPane in document-pane.js -->
    <div id="document-panes" style="display:none;"></div>
</body>

</html>
