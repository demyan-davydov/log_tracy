<html window-resizable="true" window-width="1000" window-height="800" window-frame="standard">

<head>
    <title>DLT Explorer</title>
    <style id="theme-style" src="theme-light.css" />
    <style src="style.css" />
    <style src="table.css" />
    <style src="tab-content.css" />
    <style src="menu-bar.css" />
    <style src="match-colors.css" />
    <style src="search-editor.css" />
    <script type="module" src="script.js" />
    <script type="module" src="virtual-dlt-view.js" />
</head>

<body>
    <div id="main-menu" style="display: none;">
        <ul id="menu-bar"> <!-- top level - menu bar, it must match ul#menu-bar selector, see std-menu.css -->
            <li accesskey="S"><u>S</u>imple
                <menu class="cool">
                    <li title="Hello world!">First item (with tooltip)</li>
                    <li accesskey="^2">Second item<span class="accesskey">Ctrl+2</span></li>
                    <li>Third item
                        <menu>
                            <li style="background:linear-gradient(left,yellow,red)">First sub-item</li>
                            <li>Second sub-item</li>
                        </menu>
                    </li>
                    <li accesskey="^4">Fourth item<span class="accesskey">Ctrl+4</span></li>
                    <li>Table menu
                        <menu.table>
                            <tr>
                                <td role="menu-item">1.1</td>
                                <td role="menu-item">1.2</td>
                                <td role="menu-item">1.3</td>
                            </tr>
                            <tr>
                                <td role="menu-item">2.1</td>
                                <td role="menu-item">2.2</td>
                                <td role="menu-item">2.3</td>
                            </tr>
                </menu>
            </li>
            </menu>
            </li>
            <li>Simple 2
                <menu>
                    <li>First item</li>
                    <li>Second item</li>
                    <li>Third item</li>
                </menu>
            </li>
        </ul>
    </div>
    <header>
        <!-- Open File, Settings: in the menu (macOS); the theme: in Settings -->
        <div id="tabs-container">
            <!-- The + button followed by the tabs, rendered by refreshTabs() -->
            <button id="btn-add-tab" title="New Tab" style="display:none;">+</button>
        </div>
    </header>

    <!-- Instead of all the panels below while no document is open; filled by
         renderPlaceholder() -->
    <div id="empty-placeholder" tabindex="-1" style="display:none;"></div>

    <!-- The panels of the open documents, one per tab, only the active one
         shown: DocumentPane in document-pane.js -->
    <div id="document-panes" style="display:none;"></div>
</body>

</html>
