<html window-resizable="true" window-width="1000" window-height="800" window-frame="standard">

<head>
    <title>DLT Explorer</title>
    <style id="theme-style" src="theme-light.css" />
    <style src="style.css" />
    <style src="table.css" />
    <style src="tab-content.css" />
    <style src="menu-bar.css" />
    <style src="search-editor.css" />
    <script type="module" src="script.js" />
    <script type="module" src="virtual-dlt-view.js" />
</head>

<body>
    <div id="main-menu" style="display: none;">
        <ul id="menu-bar"> <!-- top level - menu bar, it must match ul#menu-bar selector, see std-menu.css -->
            <li accesskey="S"><u>S</u>imple
                <menu class="cool">
                    <li title="Hello world!">First item (with tooltip)</li>
                    <li accesskey="^2">Second item<span class="accesskey">Ctrl+2</span></li>
                    <li>Third item
                        <menu>
                            <li style="background:linear-gradient(left,yellow,red)">First sub-item</li>
                            <li>Second sub-item</li>
                        </menu>
                    </li>
                    <li accesskey="^4">Fourth item<span class="accesskey">Ctrl+4</span></li>
                    <li>Table menu
                        <menu.table>
                            <tr>
                                <td role="menu-item">1.1</td>
                                <td role="menu-item">1.2</td>
                                <td role="menu-item">1.3</td>
                            </tr>
                            <tr>
                                <td role="menu-item">2.1</td>
                                <td role="menu-item">2.2</td>
                                <td role="menu-item">2.3</td>
                            </tr>
                </menu>
            </li>
            </menu>
            </li>
            <li>Simple 2
                <menu>
                    <li>First item</li>
                    <li>Second item</li>
                    <li>Third item</li>
                </menu>
            </li>
        </ul>
    </div>
    <header>
        <!-- Open File, Settings: in the menu (macOS); the theme: in Settings -->
        <div id="tabs-container">
            <!-- The + button followed by the tabs, rendered by refreshTabs() -->
            <button id="btn-add-tab" title="New Tab" style="display:none;">+</button>
        </div>
    </header>

    <!-- Instead of all the panels below while no document is open; filled by
         renderPlaceholder() -->
    <div id="empty-placeholder" style="display:none;"></div>

    <frameset id="document-views" cols="200px, *">
        <section class="left-panel" id="sidebar">
            <header>Filters</header>
            <!-- the filter sets of the active document: showFilters() in script.js -->
            <div id="filter-sets"></div>
            <div id="filter-message"></div>
            <div class="filter-actions">
                <button id="btn-new-dlf">New Filter</button>
                <button id="btn-dlf">Load Filter</button>
            </div>

            <header class="sidebar-section">Decoding</header>
            <div class="filter-actions">
                <button id="btn-fibex">Load FIBEX</button>
            </div>
        </section>

        <!-- right side -->
        <frameset rows="*, 250dip">
            <section id="main-content">
                <div id="tab-content" class="tab-content">
                    <!-- Status views: see .status-view in tab-content.css -->
                    <div id="loading-container" class="status-view" style="display:none;">
                        <div class="status-body">
                            <div id="doc-load-status" class="status-title">Loading file...</div>
                            <progress id="doc-load-progress" value="0" max="100"></progress>
                            <div id="doc-load-detail" class="status-detail"></div>
                            <div class="status-actions">
                                <button id="btn-cancel-load">Cancel</button>
                            </div>
                        </div>
                    </div>
                    <div id="source-lost" class="status-view" style="display:none;">
                        <div class="status-body">
                            <div class="status-title">The file is no longer available</div>
                            <div id="source-lost-path" class="status-detail status-path"></div>
                            <div id="source-lost-error" class="status-detail status-error"></div>
                            <div class="status-actions">
                                <button id="btn-lost-retry">Retry</button>
                                <button id="btn-lost-close">Close</button>
                            </div>
                        </div>
                    </div>
                    <table class="log-table main-view" fixed-layout="true">
                        <thead>
                            <!-- the columns of the format: applyColumns() in script.js -->
                            <tr>
                                <th width="20px">⚓</th>
                                <th width="80px">Index</th>
                                <th width="*">Payload</th>
                            </tr>
                        </thead>
                        <tbody />
                    </table>
                </div>
            </section>

            <section id="search-results-panel">
                <div class="toolbar search-toolbar">
                    <input type="text" id="search-input" placeholder="Search in payload (Enter)" />
                    <label><input type="checkbox" id="search-regex" /> Regex</label>
                    <label><input type="checkbox" id="search-ignore-case" /> Ignore case</label>
                    <button id="btn-search">Search</button>
                </div>
                <div id="search-message"></div>
                <!-- the chip search editor, tried side by side with the field above
                     (docs/stories/advanced-search.md) -->
                <div class="toolbar search-toolbar chip-search-toolbar">
                    <div id="chip-search" class="chip-editor" tabindex="0"></div>
                    <button id="btn-chip-search">Search</button>
                </div>
                <div id="chip-search-message"></div>

                <header>Details / Search Results</header>
                <div id="search-loading-container" class="status-view compact" style="display:none;">
                    <div class="status-body">
                        <div id="search-view-status" class="status-title">Searching...</div>
                        <progress id="search-view-progress" value="0" max="100"></progress>
                        <div id="search-view-detail" class="status-detail"></div>
                        <div class="status-actions">
                            <button id="btn-cancel-search">Cancel</button>
                        </div>
                    </div>
                </div>
                <table class="log-table search-view" fixed-layout="true">
                    <thead>
                        <!-- the columns of the format: applyColumns() in script.js -->
                        <tr>
                            <th width="20px">⚓</th>
                            <th width="80px">Index</th>
                            <th width="*">Payload</th>
                        </tr>
                    </thead>
                    <tbody />
                </table>
            </section>
        </frameset>
    </frameset>
</body>

</html>
