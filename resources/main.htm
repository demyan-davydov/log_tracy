<html window-resizable="true" window-width="1000" window-height="800" window-frame="standard">

<head>
    <title>DLT Explorer</title>
    <style id="theme-style" src="theme-light.css" />
    <style src="style.css" />
    <style src="table.css" />
    <style src="tab-content.css" />
    <style src="menu-bar.css" />
    <script type="module" src="script.js" />
    <script type="module" src="virtual-dlt-view.js" />
</head>

<body>
    <div id="main-menu" style="display: none;">
        <ul id="menu-bar"> <!-- top level - menu bar, it must match ul#menu-bar selector, see std-menu.css -->
            <li accesskey="S"><u>S</u>imple
                <menu class="cool">
                    <li title="Hello world!">First item (with tooltip)</li>
                    <li accesskey="^2">Second item<span class="accesskey">Ctrl+2</span></li>
                    <li>Third item
                        <menu>
                            <li style="background:linear-gradient(left,yellow,red)">First sub-item</li>
                            <li>Second sub-item</li>
                        </menu>
                    </li>
                    <li accesskey="^4">Fourth item<span class="accesskey">Ctrl+4</span></li>
                    <li>Table menu
                        <menu.table>
                            <tr>
                                <td role="menu-item">1.1</td>
                                <td role="menu-item">1.2</td>
                                <td role="menu-item">1.3</td>
                            </tr>
                            <tr>
                                <td role="menu-item">2.1</td>
                                <td role="menu-item">2.2</td>
                                <td role="menu-item">2.3</td>
                            </tr>
                </menu>
            </li>
            </menu>
            </li>
            <li>Simple 2
                <menu>
                    <li>First item</li>
                    <li>Second item</li>
                    <li>Third item</li>
                </menu>
            </li>
        </ul>
    </div>
    <header>
        <div class="toolbar">
            <button id="btn-open">Open File</button>
            <button id="btn-fibex">Load FIBEX</button>
            <button id="btn-dlf">Load Filter</button>
            <button id="btn-theme">Toggle Theme</button>
            <button id="btn-settings">Settings</button>
        </div>
        <div id="tabs-container">
            <!-- The + button followed by the tabs: rendered by refreshTabs() -->
            <button id="btn-add-tab">+</button>
        </div>
    </header>

    <frameset cols="200px, *">
        <section class="left-panel" id="sidebar">
            <header>Filters</header>
            <div class="filter-group">
                <label>ECU ID</label>
                <input type="text" id="filter-ecu" placeholder="e.g. ECU1" />
            </div>
            <div class="filter-group">
                <label>App ID</label>
                <input type="text" id="filter-app" placeholder="e.g. APP1" />
            </div>
            <div class="filter-group">
                <label>Context ID</label>
                <input type="text" id="filter-ctx" placeholder="e.g. CTX1" />
            </div>
            <div class="filter-group">
                <label>Payload Regex</label>
                <input type="text" id="filter-payload" placeholder="e.g. error.*" />
            </div>
            <div class="filter-actions">
                <button id="btn-clear-filters">Clear All</button>
            </div>
        </section>

        <!-- right side -->
        <frameset rows="*, 250dip">
            <section id="main-content">
                <div id="empty-placeholder" style="display:none;">
                    <div class="icon">📁</div>
                    <div class="text">No documents open. Click + to open a DLT file.</div>
                </div>
                <div id="tab-content" class="tab-content">
                    <div id="loading-container" class="loading-container" style="display:none;">
                        <progress id="doc-load-progress" value="0" max="100"></progress>
                        <div id="doc-load-status">Loading DLT file...</div>
                        <button id="btn-cancel-load">Cancel</button>
                    </div>
                    <div id="source-lost" class="source-lost" style="display:none;">
                        <div class="source-lost-title">The file is no longer available</div>
                        <div id="source-lost-path"></div>
                        <div id="source-lost-error"></div>
                        <div class="source-lost-actions">
                            <button id="btn-lost-retry">Retry</button>
                            <button id="btn-lost-close">Close</button>
                        </div>
                    </div>
                    <table class="log-table main-view" fixed-layout="true">
                        <thead>
                            <tr>
                                <th width="20px">⚓</th>
                                <th width="80px">Index</th>
                                <th width="120px">Time</th>
                                <th width="150px">Timestamp</th>
                                <th width="60px">EcuId</th>
                                <th width="60px">AppId</th>
                                <th width="60px">CtxId</th>
                                <th width="60px">Type</th>
                                <th width="60px">Level</th>
                                <th width="*">Payload</th>
                            </tr>
                        </thead>
                        <tbody />
                    </table>
                </div>
            </section>

            <section id="search-results-panel">
                <div class="toolbar search-toolbar">
                    <input type="text" id="search-input" placeholder="Search in payload (Enter)" />
                    <label><input type="checkbox" id="search-regex" /> Regex</label>
                    <label><input type="checkbox" id="search-ignore-case" /> Ignore case</label>
                    <button id="btn-search">Search</button>
                </div>
                <div id="search-message"></div>

                <header>Details / Search Results</header>
                <div id="search-loading-container" class="loading-container" style="display:none;">
                    <progress id="search-view-progress" value="0" max="100"></progress>
                    <div id="search-view-status">Searching...</div>
                    <button id="btn-cancel-search">Cancel</button>
                </div>
                <table class="log-table search-view" fixed-layout="true">
                    <thead>
                        <tr>
                            <th width="20px">⚓</th>
                            <th width="80px">Index</th>
                            <th width="120px">Time</th>
                            <th width="150px">Timestamp</th>
                            <th width="60px">EcuId</th>
                            <th width="60px">AppId</th>
                            <th width="60px">CtxId</th>
                            <th width="60px">Type</th>
                            <th width="60px">Level</th>
                            <th width="*">Payload</th>
                        </tr>
                    </thead>
                    <tbody />
                </table>
            </section>
        </frameset>
    </frameset>
</body>

</html>
