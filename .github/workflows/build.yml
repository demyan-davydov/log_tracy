# Builds and tests Log Tracy on macOS, Linux and Windows through scripts/build.mjs, and keeps
# the distribution of each as an artifact. See docs/building.md.
name: build

on:
  push: # every branch: work is merged locally, not through pull requests; a tag v<VERSION> releases
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one system doesn't hide the others
      matrix:
        include:
          - os: macos-latest # arm64
            sciter: libs/macosx/libsciter.dylib.br
          - os: ubuntu-latest
            sciter: libs/linux/x64/libsciter.so.br
          - os: ubuntu-24.04-arm
            sciter: libs/linux/arm64/libsciter.so.br
          - os: windows-latest
            sciter: libs/windows/x64/sciter.dll.br
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Sciter libraries of libs/ are in Git LFS, packed (<library>.br): scripts/build.mjs
      # fetches and unpacks only the one of this system, on the first build. Cached by its LFS object, so a run downloads it only
      # when it changes
      - name: The LFS object of the Sciter library
        shell: bash
        run: git lfs ls-files --long --include="${{ matrix.sciter }}" | cut -d ' ' -f1 > .lfs-objects
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.lfs-objects') }}

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GTK 3 (Sciter draws with it) and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb

      # the unittests load Sciter: on Linux with a display, should it need one
      - name: Test
        if: runner.os != 'Linux'
        run: node scripts/test.mjs
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test.mjs
      - name: Distribution
        run: node scripts/build.mjs dist

      # packed here: an artifact is zipped without the executable bits of the files. Named by
      # the system and the architecture: Linux is built on x64 and arm64
      - name: Pack the distribution
        shell: bash
        run: tar -czf log-tracy-${{ runner.os }}-${{ runner.arch }}.tar.gz -C build/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: log-tracy-${{ runner.os }}-${{ runner.arch }}
          path: log-tracy-${{ runner.os }}-${{ runner.arch }}.tar.gz
      # the installers on their own: they keep what they install as it is, the zip harms nothing
      - uses: actions/upload-artifact@v4
        with:
          name: log-tracy-${{ runner.os }}-${{ runner.arch }}-installer
          path: |
            build/dist/macos/*.dmg
            build/dist/linux/*.deb
            build/dist/windows/*.zip
          if-no-files-found: error

      # The program of the distribution started as Explorer starts it, no stdout or stderr: it
      # shows its window (utils/std_streams). Without one, what tells why goes to build/ci/.
      # After the uploads: a failure here leaves the distribution to download
      - name: Start the distribution without standard streams
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/utils/windows-start-check.ps1
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-start-check
          path: build/ci/
          if-no-files-found: ignore

  # A tag v<VERSION> (git tag v0.9.0 && git push origin v0.9.0) publishes a release of GitHub
  # with the installers of every system and architecture, once every build has passed. The tag must be
  # the version of the VERSION file
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: log-tracy-*-installer
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version of VERSION, v$version"
            exit 1
          fi
          # each artifact keeps its folder (macos/, linux/, windows/): the files, wherever they are
          mapfile -t files < <(find installers -type f)
          ls -l "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
            --title "Log Tracy $version" --generate-notes
