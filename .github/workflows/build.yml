# Builds and tests DLT Explorer on macOS, Linux and Windows through scripts/build.mjs, and keeps
# the distribution of each as an artifact. See docs/building.md.
name: build

on:
  push: # every branch: work is merged locally, not through pull requests
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one system doesn't hide the others
      matrix:
        include:
          - os: macos-latest # arm64
            sciter: libs/macosx/libsciter.dylib
          - os: ubuntu-latest
            sciter: libs/linux/x64/libsciter.so
          - os: windows-latest
            sciter: libs/windows/x64/sciter.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Sciter libraries of libs/ are in Git LFS: only the one of this system is fetched,
      # and cached by its LFS object, so a run downloads it only when it changes
      - name: The LFS object of the Sciter library
        shell: bash
        run: git lfs ls-files --long --include="${{ matrix.sciter }}" | cut -d ' ' -f1 > .lfs-objects
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-objects') }}
      - name: Fetch the Sciter library
        run: git lfs pull --include="${{ matrix.sciter }}"

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GTK 3 (Sciter draws with it) and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb

      # the unittests load Sciter: on Linux with a display, should it need one
      - name: Test
        if: runner.os != 'Linux'
        run: node scripts/build.mjs test
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/build.mjs test
      - name: Check the Windows compile
        if: runner.os == 'Linux'
        run: node scripts/build.mjs check-windows
      - name: Distribution
        run: node scripts/build.mjs dist

      # packed here: an artifact is zipped without the executable bits of the files
      - name: Pack the distribution
        shell: bash
        run: tar -czf dlt-explorer-${{ runner.os }}.tar.gz -C build/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dlt-explorer-${{ runner.os }}
          path: dlt-explorer-${{ runner.os }}.tar.gz
