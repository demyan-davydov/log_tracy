# Builds and tests DLT Explorer on macOS, Linux and Windows through scripts/build.mjs, and keeps
# the distribution of each as an artifact. See docs/building.md.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one system doesn't hide the others
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest] # macos-latest is arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Sciter libraries of libs/ are in Git LFS: cached by the list of LFS objects, so a
      # run fetches them only when they change, not spending the LFS bandwidth every time
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Fetch LFS objects
        run: git lfs pull

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GTK 3 (Sciter draws with it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Test
        run: node scripts/build.mjs test
      - name: Check the Windows compile
        if: runner.os == 'Linux'
        run: node scripts/build.mjs check-windows
      - name: Distribution
        run: node scripts/build.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: dlt-explorer-${{ runner.os }}
          path: build/dist/
