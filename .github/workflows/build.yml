# Builds and tests Log Tracy on macOS, Linux and Windows through scripts/build.mjs, and keeps
# the distribution of each as an artifact. See docs/building.md.
name: build

on:
  push: # every branch: work is merged locally, not through pull requests; a tag v<VERSION> releases
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one system doesn't hide the others
      matrix:
        include:
          - os: macos-latest # arm64
            sciter: libs/macosx/libsciter.dylib
          - os: ubuntu-latest
            sciter: libs/linux/x64/libsciter.so
          - os: windows-latest
            sciter: libs/windows/x64/sciter.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The Sciter libraries of libs/ are in Git LFS: scripts/build.mjs fetches only the one of
      # this system, on the first build. Cached by its LFS object, so a run downloads it only
      # when it changes
      - name: The LFS object of the Sciter library
        shell: bash
        run: git lfs ls-files --long --include="${{ matrix.sciter }}" | cut -d ' ' -f1 > .lfs-objects
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-objects') }}

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: GTK 3 (Sciter draws with it) and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb

      # the unittests load Sciter: on Linux with a display, should it need one
      - name: Test
        if: runner.os != 'Linux'
        run: node scripts/build.mjs test
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/build.mjs test
      - name: Check the Windows compile
        if: runner.os == 'Linux'
        run: node scripts/build.mjs check-windows
      - name: Distribution
        run: node scripts/build.mjs dist

      # packed here: an artifact is zipped without the executable bits of the files
      - name: Pack the distribution
        shell: bash
        run: tar -czf log-tracy-${{ runner.os }}.tar.gz -C build/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: log-tracy-${{ runner.os }}
          path: log-tracy-${{ runner.os }}.tar.gz
      # the installers on their own: they keep what they install as it is, the zip harms nothing
      - uses: actions/upload-artifact@v4
        with:
          name: log-tracy-${{ runner.os }}-installer
          path: |
            build/dist/macos/*.dmg
            build/dist/linux/*.deb
            build/dist/windows/*.zip
          if-no-files-found: error

  # A tag v<VERSION> (git tag v0.9.0 && git push origin v0.9.0) publishes a release of GitHub
  # with the installers of the three systems, once every build has passed. The tag must be
  # the version of the VERSION file
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: log-tracy-*-installer
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version of VERSION, v$version"
            exit 1
          fi
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag \
            --title "Log Tracy $version" --generate-notes
